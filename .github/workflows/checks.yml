name: Checks
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'infra/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'requirements-cloud-iac.txt', 'tsconfig.json', '*config.ts', '.github/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec prettier --check apps/web/src packages infra tests
      - run: bash -n infra/relay/bootstrap.sh && python3 -m py_compile infra/relay/lease.py infra/relay/health.py
      - run: pnpm test
      - run: pnpm test:dynamodb
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/experiment-cloud-durability.mjs
      - run: node scripts/experiment-cloud-server-crash.mjs
      - run: node scripts/experiment-peer-durability.mjs
      - run: node scripts/experiment-bound-channel.mjs
      - run: node scripts/check-offline-shell.mjs
      - run: pnpm test:e2e
  cloud-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-cloud-iac.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv/cloud-iac
      - run: .venv/cloud-iac/bin/python -m pip install --requirement requirements-cloud-iac.txt
      - run: pnpm cloud:build
      - run: pnpm cloud:iac:render
      - run: pnpm cloud:iac:check
      - run: pnpm cloud:check
      - run: node --input-type=module -e "await import('./infra/cloud/inspection-identity.ts'); await import('./infra/cloud/stack-metadata.ts'); await import('./infra/cloud/fixed-target-metadata.ts'); await import('./infra/cloud/artifact-bucket-metadata.ts'); await import('./infra/cloud/cognito-pool-collisions.ts'); await import('./infra/cloud/cognito-domain-collisions.ts'); await import('./infra/cloud/run-manifest.ts'); await import('./infra/cloud/manifest-storage.ts'); await import('./infra/cloud/historical-inventory.ts'); await import('./infra/cloud/run-plan-context.ts'); await import('./infra/cloud/run-reservation-binding.ts'); await import('./infra/cloud/run-context-storage.ts')"
      - run: pnpm exec vitest run tests/unit/cloud-ledger-store.test.ts tests/unit/cloud-run-ledger.test.ts tests/unit/cloud-expected-inventory.test.ts tests/unit/cloud-source-observations.test.ts tests/unit/cloud-inspection-identity.test.ts tests/unit/cloud-stack-metadata.test.ts tests/unit/cloud-fixed-target-metadata.test.ts tests/unit/cloud-artifact-bucket-metadata.test.ts tests/unit/cloud-cognito-pool-collisions.test.ts tests/unit/cloud-cognito-domain-collisions.test.ts tests/unit/cloud-run-manifest.test.ts tests/unit/cloud-manifest-storage.test.ts tests/unit/cloud-historical-inventory.test.ts tests/unit/cloud-retained-stack-metadata.test.ts tests/unit/cloud-retained-fixed-targets.test.ts tests/unit/cloud-retained-artifact-bucket.test.ts tests/unit/cloud-retained-cognito-pools.test.ts tests/unit/cloud-retained-cognito-domain.test.ts tests/unit/cloud-run-plan-context.test.ts tests/unit/cloud-run-reservation-binding.test.ts tests/unit/cloud-run-context-storage.test.ts
  native:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path apps/native/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/native/src-tauri/Cargo.toml
      - run: pnpm mac:build
