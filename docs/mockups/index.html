<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Synkies screen mockups</title>
  <link rel="stylesheet" href="styles.css?v=synkies-brand-08">
</head>
<body data-theme="light">
  <header class="gallery-header">
    <a class="gallery-brand" href="#mac-desktop"><img class="brand-lockup brand-light" src="brand/logo-light.svg" alt="Synkies"><img class="brand-lockup brand-dark" src="brand/logo-dark.svg" alt="Synkies"> <span class="gallery-divider">/</span><span class="gallery-title">Screen mockups</span></a>
    <div class="gallery-tools"><span id="screen-count"></span><button id="appearance" aria-label="Switch to dark appearance">Dark appearance</button></div>
  </header>
  <div class="gallery-layout">
    <nav class="gallery-nav" aria-label="Mockup screens"><div class="gallery-nav-intro">DESIGN PREVIEW<span>Synthetic content. No app actions are saved.</span></div><div id="screen-nav"></div></nav>
    <main class="gallery-main">
      <div class="screen-heading"><div><span id="screen-platform"></span><h1 id="screen-title"></h1><p id="screen-description"></p></div><div class="screen-arrows"><button id="previous" aria-label="Previous mockup">←</button><button id="next" aria-label="Next mockup">→</button></div></div>
      <div class="preview-stage"><div id="artboard"></div></div>
      <footer class="gallery-footer"><span id="screen-requirements"></span><span>Use ← and → to browse · Click app controls to explore related screens</span></footer>
    </main>
  </div>
  <script src="desktop.js?v=synkies-brand-08"></script>
  <script src="modes.js?v=synkies-brand-08"></script>
  <script src="screens.js?v=synkies-brand-08"></script>
</body>
</html>
