[package]
name = "peel"
version = "0.1.0"
description = "Quick local notes for Mac"
edition = "2021"
rust-version = "1.90"

[lib]
name = "peel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
cc = "=1.10.0"

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-dialog = "=2.8.3"
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
